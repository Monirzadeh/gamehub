[package]
name = "gamehub"
version = "0.3.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
glib = "0.22"
gio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = "2"
